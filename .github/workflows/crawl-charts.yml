name: Crawl Music Charts

on:
  # CF Worker (chartbot-trigger) 가 workflow_dispatch 로 정시 트리거함.
  # GHA schedule 은 피크 시간 지연(5~40분) 때문에 비활성화.
  # schedule:
  #   - cron: '0 15-23,0-14 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run chart crawler
      run: |
        # 최신 변경사항을 먼저 가져오기 (특히 last_tweet_timestamp.json)
        git pull origin main --no-rebase
        # last_tweet_timestamp.json 파일이 없으면 생성
        mkdir -p docs
        if [ ! -f docs/last_tweet_timestamp.json ]; then
          echo '{}' > docs/last_tweet_timestamp.json
        fi
        python main.py
      env:
        # 트위터 환경 변수 비활성화 (요청에 따라 주석 처리)
        # TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        # TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        # TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        # TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        # TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    
    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add docs/
        # 변경 사항이 있을 때만 커밋
        if ! git diff --staged --quiet; then
          git commit -m "📈 차트 데이터 자동 업데이트"
          # 원격 변경사항을 먼저 가져오기
          git pull origin main --no-rebase
          git push origin main
        else
          echo "No changes to commit."
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v5
    
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4