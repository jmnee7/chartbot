name = "chartbot-trigger"
main = "src/worker.js"
compatibility_date = "2026-04-20"

# 매 시간 정각(UTC) = 매 시간 정각(KST)도 동일 분(00)
# GHA schedule보다 훨씬 정확함 (typical jitter < 60s)
[triggers]
crons = ["0 * * * *"]

[vars]
OWNER = "jmnee7"
REPO = "chartbot"
WORKFLOW_FILE = "crawl-charts.yml"
REF = "main"

# Secrets (wrangler secret put <NAME>):
#   GITHUB_TOKEN        - fine-grained PAT, actions:write on jmnee7/chartbot
#   TRIGGER_SECRET      - (optional) shared secret for manual /trigger endpoint
